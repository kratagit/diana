name: Release

# Merge PR na main z etykietą patch / minor / major -> testy, paczki na Windows, macOS i Linux oraz GitHub Release.
# Wersja nie jest zapisana w repozytorium: to ostatni tag vX.Y.Z podbity zgodnie z etykietą
# (pierwsze wydanie: v1.0.0). PR bez etykiety nie tworzy wydania.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  wersja:
    if: >-
      github.event.pull_request.merged &&
      (contains(github.event.pull_request.labels.*.name, 'patch') ||
       contains(github.event.pull_request.labels.*.name, 'minor') ||
       contains(github.event.pull_request.labels.*.name, 'major'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0   # tagi potrzebne do wyliczenia wersji
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Testy
        run: npm test
      - name: Wylicz wersję
        id: ver
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          case " $LABELS " in *" major "*) bump=major;; *" minor "*) bump=minor;; *) bump=patch;; esac
          last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          IFS=. read -r major minor patch <<< "${last#v}"
          if [ -z "$last" ]; then v=1.0.0
          elif [ "$bump" = major ]; then v="$((major + 1)).0.0"
          elif [ "$bump" = minor ]; then v="$major.$((minor + 1)).0"
          else v="$major.$minor.$((patch + 1))"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Wersja: $v ($bump, poprzednia: ${last:-brak})"

  paczki:
    needs: wersja
    strategy:
      matrix:
        include:
          - os: windows-latest   # instalator .exe
            args: --win --x64
          - os: macos-latest     # .dmg dla Maców z Intelem i z Apple Silicon
            args: --mac --universal
          - os: ubuntu-latest    # AppImage i .deb
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Paczka (electron-builder)
        run: npx electron-builder ${{ matrix.args }} --publish never -c.extraMetadata.version=${{ needs.wersja.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: paczka-${{ matrix.os }}
          path: |
            dist/diana-*-setup.exe
            dist/diana-*.dmg
            dist/diana-*.AppImage
            dist/diana-*.deb
          if-no-files-found: error

  wydanie:
    needs: [wersja, paczki]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paczki
          merge-multiple: true
      - name: Utwórz GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.wersja.outputs.version }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: gh release create "v$V" paczki/* --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "DIANA v$V" --generate-notes
